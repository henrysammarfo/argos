# Blueprint: ARGOS production on Render (API + DB + agents).
# Frontend deploys separately on Vercel — see docs/DEPLOY.md

services:
  - type: web
    name: argos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: argos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: KASPA_NODE_URL
        value: https://api-tn10.kaspa.org
      - key: KASPA_NETWORK
        value: kaspatest
      - key: ESCROW_WALLET_ADDRESS
        sync: false
      - key: PROGRAM_ADMIN_ADDRESS
        sync: false
      - key: KASPA_PRIVATE_KEY
        sync: false
      - key: ASI_ONE_API_KEY
        sync: false
      - key: AGENTVERSE_API_KEY
        sync: false
      - key: ORCHESTRATOR_ADDRESS
        sync: false
      - key: INTAKE_ADDRESS
        sync: false
      - key: TECHNICAL_ADDRESS
        sync: false
      - key: IMPACT_ADDRESS
        sync: false
      - key: TEAM_ADDRESS
        sync: false
      - key: MILESTONE_ADDRESS
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: EVAL_CONCURRENCY
        value: "5"

  - type: worker
    name: argos-agents
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    autoDeploy: true
    dockerCommand: python agents/run_mailbox_agents.py
    envVars:
      - key: ENV
        value: production
      - key: USE_AGENTVERSE_MAILBOX
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: argos-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ASI_ONE_API_KEY
        sync: false
      - key: AGENTVERSE_API_KEY
        sync: false
      - key: ORCHESTRATOR_ADDRESS
        sync: false
      - key: INTAKE_ADDRESS
        sync: false
      - key: TECHNICAL_ADDRESS
        sync: false
      - key: IMPACT_ADDRESS
        sync: false
      - key: TEAM_ADDRESS
        sync: false
      - key: MILESTONE_ADDRESS
        sync: false
      - key: KASPA_NODE_URL
        value: https://api-tn10.kaspa.org
      - key: KASPA_NETWORK
        value: kaspatest

databases:
  - name: argos-db
    plan: starter
    databaseName: argos
    user: argos
