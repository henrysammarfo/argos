# Fly.io — ARGOS API (deploy from repo root: fly deploy -c backend/fly.toml)
# Free allowance may apply; see docs/DEPLOY.md for fully free Oracle VM option.

app = "argos-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  WEB_CONCURRENCY = "2"
  EVAL_CONCURRENCY = "5"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health/ready"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
